<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Layout</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header Section: Contains the navigation bar with logo and nav links -->
    <header id="navbar">
        <div class="logo"></div>
        <nav class="nav-links"></nav>
    </header>

    <!-- Services Section: Displays "What We Do" items -->
    <section id="services-section" class="section-padding section-margin-bottom grey-border">
        <!-- Section Title Placeholder -->
        <div class="section-title"></div>
        <!-- Container for service items, using flexbox for layout -->
        <div class="item-container">
            <!-- Individual Service Item -->
            <div class="section-item">
                <!-- Circular placeholder for icon/image -->
                <div class="circle-placeholder h-60px w-60px"></div>
                <!-- Block placeholders for text content -->
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
            </div>
            <!-- Repeat for second service item -->
            <div class="section-item">
                <div class="circle-placeholder h-60px w-60px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
            </div>
            <!-- Repeat for third service item -->
            <div class="section-item">
                <div class="circle-placeholder h-60px w-60px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
            </div>
        </div>
    </section>

    <!-- Points of Sale Section: Displays location/sale points -->
    <section id="points-of-sale-section" class="section-padding section-margin-bottom grey-border">
        <div class="section-title"></div>
        <!-- Container for points of sale items -->
        <div class="item-container">
            <!-- Individual Point of Sale Item -->
            <div class="section-item">
                <div class="circle-placeholder h-60px w-60px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
            </div>
            <!-- Repeat for second point of sale item -->
            <div class="section-item">
                <div class="circle-placeholder h-60px w-60px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
            </div>
            <!-- Repeat for third point of sale item -->
            <div class="section-item">
                <div class="circle-placeholder h-60px w-60px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
            </div>
        </div>
    </section>

    <!-- Pricing Tables Section: Displays different pricing plans -->
    <section id="pricing-tables-section" class="section-padding section-margin-bottom grey-border">
        <div class="section-title"></div>
        <!-- Container for pricing table items -->
        <div class="item-container">
            <!-- Individual Pricing Table Item -->
            <div class="section-item">
                <div class="circle-placeholder h-60px w-60px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <!-- Placeholder for price display -->
                <div class="price-box"></div>
                <!-- Placeholder for call-to-action button -->
                <div class="button-box"></div>
            </div>
            <!-- "Most Popular" Pricing Table Item -->
            <div class="section-item popular">
                <div class="circle-placeholder h-60px w-60px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="price-box"></div>
                <div class="button-box"></div>
            </div>
            <!-- Repeat for third pricing table item -->
            <div class="section-item">
                <div class="circle-placeholder h-60px w-60px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="block-placeholder w-80p h-15px"></div>
                <div class="price-box"></div>
                <div class="button-box"></div>
            </div>
        </div>
    </section>

    <!-- Testimonials Section: Displays client feedback -->
    <section id="testimonials-section" class="section-padding section-margin-bottom grey-border">
        <div class="section-title"></div>
        <!-- Container for testimonial items -->
        <div class="item-container">
            <!-- Individual Testimonial Item -->
            <div class="section-item">
                <!-- Placeholder for quote text -->
                <div class="quote-box"></div>
                <!-- Container for author name and image -->
                <div class="author-info">
                    <div class="block-placeholder w-120px h-12px"></div>
                    <div class="circle-placeholder h-30px w-30px"></div>
                </div>
            </div>
            <!-- Repeat for second testimonial item -->
            <div class="section-item">
                <div class="quote-box"></div>
                <div class="author-info">
                    <div class="block-placeholder w-120px h-12px"></div>
                    <div class="circle-placeholder h-30px w-30px"></div>
                </div>
            </div>
        </div>
        <!-- Pagination dots for testimonials carousel -->
        <div class="pagination">
            <div class="dot active"></div> <!-- Active dot -->
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </section>

    <!-- Clients Section: Displays client logos -->
    <section id="clients-section" class="section-padding section-margin-bottom grey-border">
        <div class="section-title"></div>
        <!-- Container for client logos -->
        <div class="item-container clients-logos">
            <!-- Placeholder for individual client logo -->
            <div class="logo-placeholder"></div>
            <div class="logo-placeholder"></div>
            <div class="logo-placeholder"></div>
            <div class="logo-placeholder"></div>
            <div class="logo-placeholder"></div>
        </div>
    </section>

    <!-- Footer Section: Contains footer navigation and social icons -->
    <footer id="footer" class="dark-grey-footer-bg text-white">
        <!-- Top part of the footer with logo and search box -->
        <div class="footer-top">
            <div class="footer-logo"></div>
            <div class="search-box"></div>
        </div>
        <!-- Bottom part of the footer with copyright and social icons -->
        <div class="footer-bottom">
            <!-- Placeholder for copyright/text -->
            <div class="block-placeholder w-250px h-15px" style="background-color: #d3d3d3;"></div>
            <!-- Container for social media icons -->
            <div class="social-icons">
                <!-- Placeholder for individual social icon -->
                <div class="icon-placeholder"></div>
                <div class="icon-placeholder"></div>
                <div class="icon-placeholder"></div>
                <div class="icon-placeholder"></div>
            </div>
        </div>
    </footer>
</body>
</html>
